<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <style>
      .jecri-maroon { fill: #8b2e2e; }
      .jecri-text { font-family: 'Georgia', serif; font-weight: bold; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="white"/>
  
  <!-- Main Icon (Scaled to fit) -->
  <g transform="translate(96, 60) scale(0.6)">
    <!-- Scales/Balance -->
    <g class="jecri-maroon">
      <!-- Left leaf -->
      <path d="M -45 -20 Q -50 0 -45 20 Q -40 10 -35 0 Q -40 -10 -45 -20" stroke="none"/>
      <!-- Left leaf detail -->
      <path d="M -42 -15 L -40 0 M -42 -10 L -38 0 M -42 -5 L -38 0 M -42 5 L -40 0 M -42 10 L -38 0 M -42 15 L -40 0" stroke="#8b2e2e" stroke-width="2" fill="none"/>
      
      <!-- Building/courthouse -->
      <rect x="-30" y="-25" width="60" height="50" stroke="#8b2e2e" stroke-width="2" fill="none"/>
      
      <!-- Roof triangle -->
      <polygon points="0,-30 -35,-25 35,-25" fill="none" stroke="#8b2e2e" stroke-width="2"/>
      
      <!-- Roof peak detail -->
      <circle cx="0" cy="-32" r="3" fill="#8b2e2e"/>
      
      <!-- Columns -->
      <rect x="-18" y="-20" width="4" height="45" fill="#8b2e2e"/>
      <rect x="-8" y="-20" width="4" height="45" fill="#8b2e2e"/>
      <rect x="4" y="-20" width="4" height="45" fill="#8b2e2e"/>
      <rect x="14" y="-20" width="4" height="45" fill="#8b2e2e"/>
      
      <!-- Scales -->
      <circle cx="-8" cy="-5" r="8" fill="none" stroke="#8b2e2e" stroke-width="2"/>
      <circle cx="8" cy="-5" r="8" fill="none" stroke="#8b2e2e" stroke-width="2"/>
      
      <!-- Balance beam -->
      <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#8b2e2e" stroke-width="2"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#8b2e2e" stroke-width="2"/>
      
      <!-- Right leaf -->
      <path d="M 45 -20 Q 50 0 45 20 Q 40 10 35 0 Q 40 -10 45 -20" stroke="none"/>
      <!-- Right leaf detail -->
      <path d="M 42 -15 L 40 0 M 42 -10 L 38 0 M 42 -5 L 38 0 M 42 5 L 40 0 M 42 10 L 38 0 M 42 15 L 40 0" stroke="#8b2e2e" stroke-width="2" fill="none"/>
      
      <!-- Bottom line detail -->
      <line x1="-35" y1="30" x2="35" y2="30" stroke="#8b2e2e" stroke-width="2"/>
      <circle cx="0" cy="35" r="3" fill="#8b2e2e"/>
    </g>
  </g>
  
  <!-- Text below (JECRI BUREAU) -->
  <text x="96" y="155" text-anchor="middle" class="jecri-text jecri-maroon" font-size="18" letter-spacing="2">JECRI BUREAU</text>
</svg>
